plugins { id 'com.android.application' version '8.7.3' }

if (providers.gradleProperty('shareSubBuildDir').isPresent()) {
    layout.buildDirectory.set(file(providers.gradleProperty('shareSubBuildDir').get()))
}

android {
    namespace 'ru.sharesub.vpn'
    compileSdk 35
    defaultConfig {
        applicationId 'ru.sharesub.vpn'
        minSdk 29
        targetSdk 35
        versionCode 7
        versionName '1.2.2'
        resValue 'string', 'app_version', versionName
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDirs += rootProject.file('../app')
    sourceSets.main.assets.srcDirs += rootProject.file('../vendor/android/notices')
    sourceSets.main.assets.srcDirs += rootProject.file('../vendor/android/geodata')
    packaging { jniLibs { useLegacyPackaging = false; keepDebugSymbols += '**/libgojni.so' } }
}

dependencies { implementation files(rootProject.file('../vendor/android/libXray.aar')) }
